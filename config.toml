theme = "autumn_night"
# theme = "github_dark_high_contrast"

#_________________________________________________
[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
"C-l" = ["collapse_selection", "keep_primary_selection"]
"C-q" = [":bc"]
X = ["extend_line_up", "extend_to_line_bounds"]

"C-e" = [
  ":new",
  ":insert-output yazi --chooser-file=/dev/stdout",
  "split_selection_on_newline",
  "goto_file",
  "goto_last_modification",
  "goto_last_modified_file",
  ":buffer-close!",
  ":theme costume_theme_xresources",
  ":redraw",
]


"C-f" =[
  ":new",
  ":insert-output lf-pick", "split_selection_on_newline", "goto_file", "goto_last_modification", "goto_last_modified_file",
  ":buffer-close!",
  ":theme costume_theme_xresources",
  ':redraw',
]

#_________________________________________________
[keys.insert]
"C-l" = ["normal_mode"]

#_________________________________________________
[editor]
line-number = "relative"
true-color = true
mouse = false
bufferline = "multiple"
auto-format = true

#___auto_complete_config
auto-completion = true
completion-trigger-len = 0
idle-timeout = 0

#_________________________________________________
[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

#_________________________________________________
[editor.file-picker]
hidden = false

#_________________________________________________
[editor.statusline]
left = ["mode", "spinner"]
center = ["file-name"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "|"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"


#_________________________________________________
[editor.indent-guides]
render = true


